name: Build & Publish Release Artifacts

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Google Play App Bundle (.aab)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Build Optimized Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if provided in secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding upload keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          else
            echo "No custom release keystore provided. Generating a standalone CI signing key..."
            keytool -genkeypair -v -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=NetTrace, OU=Mobile, O=AIStudio, L=MountainView, S=CA, C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Assemble Release APK (R8 Full Mode & Shrink Resources)
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble Release App Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_bundle }}
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Inspect & Display Output File Sizes
        run: |
          echo "=== Release APK Size ==="
          ls -lh app/build/outputs/apk/release/
          if [ -d "app/build/outputs/bundle/release" ]; then
            echo "=== Release AAB Size ==="
            ls -lh app/build/outputs/bundle/release/
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nettrace-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB) Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: nettrace-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Attach Assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
